<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Butik Mutfak — Maliyet & Satış</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon.svg">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="theme-color" content="#e83e8c">
<meta name="apple-mobile-web-app-capable" content="yes">
<style>
:root{
  --bg:#fff7fb;--card:#fff;--card2:#fffafc;--tx:#2b1533;--mu:#8a6f86;
  --pr:#e83e8c;--pr2:#ff6fb0;--pk:#ffe4f1;--gold:#dfa100;--mint:#16a394;--lav:#8b5cf6;
  --bd:#f4dae8;--sh:0 10px 28px rgba(214,51,108,.10);--sh2:0 2px 8px rgba(214,51,108,.07);
  --on:#fff;--an:#e83e8c;
  --grad:linear-gradient(135deg,#ff4f9a 0%,#ff8a5c 58%,#ffc15e 100%);
  --grad2:linear-gradient(135deg,#a855f7,#ec4899);
  --ph:#fff;
}
[data-theme=dark]{
  --bg:#160f19;--card:#241829;--card2:#2c1e31;--tx:#fdeff7;--mu:#c3a4bb;
  --pr:#ff6aad;--pr2:#ffa0cc;--pk:#3d2340;--gold:#ffcf5c;--mint:#4fd1c5;--lav:#b794f6;
  --bd:#422b46;--sh:0 10px 28px rgba(0,0,0,.45);--sh2:0 2px 10px rgba(0,0,0,.35);
  --ph:#fdf8fb;--an:#ff6aad;
  --grad:linear-gradient(135deg,#ff3d8f 0%,#ff7a4d 58%,#ffb648 100%);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{scroll-behavior:smooth}
html,body{max-width:100%;overflow-x:hidden}
body{margin:0;font:15px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--tx);-webkit-font-smoothing:antialiased;transition:background .35s,color .35s}
body:before{content:"";position:fixed;inset:0;z-index:-1;pointer-events:none;
  background:
   radial-gradient(900px 420px at 8% -6%,#ffd9ec 0%,transparent 62%),
   radial-gradient(760px 380px at 100% 4%,#ffe6cf 0%,transparent 60%),
   radial-gradient(720px 480px at 50% 108%,#e9d9ff 0%,transparent 62%);
  transition:opacity .35s}
[data-theme=dark] body:before{opacity:.30}
h1,h2,h3,h4{font-family:"Iowan Old Style","Palatino Linotype",Palatino,Georgia,serif;font-weight:700;letter-spacing:-.2px;margin:0}
h2{font-size:22px;margin:20px 2px 12px}
h3{font-size:19px}h4{font-size:15px;margin:16px 0 8px;color:var(--mu);letter-spacing:.3px;text-transform:uppercase;font-family:inherit;font-weight:800;font-size:11.5px}
small{color:var(--mu)}
#app{min-height:100vh;padding-bottom:96px;max-width:100%;overflow-x:clip}
#main{min-width:0}
.two>*,.two3>*,.tiles>*,.cat>*,.quick>*{min-width:0}
input,select{min-width:0}
.wrap{width:100%;max-width:940px;margin:0 auto;padding:0 14px}
/* ---------- üst bar ---------- */
#top{position:sticky;top:0;z-index:30;backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);
  background:color-mix(in srgb,var(--bg) 76%,transparent);border-bottom:1px solid transparent;transition:.3s}
#top.stuck{border-color:var(--bd)}
#top .wrap{display:flex;align-items:center;gap:10px;padding-top:calc(10px + env(safe-area-inset-top));padding-bottom:10px}
.brand{display:flex;align-items:center;gap:9px;min-width:0}
.logo{width:38px;height:38px;border-radius:13px;background:var(--grad);display:grid;place-items:center;font-size:20px;box-shadow:0 6px 16px rgba(232,62,140,.32);flex:none}
.brand b{font-family:"Iowan Old Style",Georgia,serif;font-size:17px;display:block;line-height:1.05;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.brand small{font-size:10.5px;letter-spacing:.6px;text-transform:uppercase;font-weight:700;opacity:.75}
.iconbtn{width:38px;height:38px;border-radius:50%;border:1px solid var(--bd);background:var(--card);color:var(--tx);font-size:17px;display:grid;place-items:center;cursor:pointer;transition:.18s;flex:none}
.iconbtn:active{transform:scale(.92)}
/* ---------- alt menü ---------- */
#nav{position:fixed;bottom:0;left:0;right:0;z-index:40;display:flex;gap:2px;padding:6px 6px calc(6px + env(safe-area-inset-bottom));
  background:color-mix(in srgb,var(--card) 88%,transparent);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);
  border-top:1px solid var(--bd);box-shadow:0 -8px 30px rgba(214,51,108,.10)}
#nav button{flex:1;background:none;border:0;color:var(--mu);font:inherit;font-size:10px;font-weight:600;padding:5px 0 4px;border-radius:14px;cursor:pointer;transition:.2s;display:grid;justify-items:center;gap:1px}
#nav button span{font-size:20px;line-height:1.15;transition:transform .22s}
#nav button.on{color:var(--pr);background:var(--pk)}
#nav button.on span{transform:translateY(-1px) scale(1.12)}
#nav button:active span{transform:scale(.9)}
/* ---------- hero ---------- */
.hero{position:relative;border-radius:26px;padding:20px 20px 18px;color:#fff;background:var(--grad);overflow:hidden;
  box-shadow:0 16px 38px -12px rgba(232,62,140,.55);margin:6px 0 16px}
.hero:before{content:"";position:absolute;inset:0;background:
  radial-gradient(120px 120px at 88% 8%,rgba(255,255,255,.34),transparent 70%),
  radial-gradient(180px 180px at 104% 108%,rgba(255,255,255,.20),transparent 70%)}
.hero .row{position:relative;display:flex;justify-content:space-between;gap:10px;align-items:flex-start}
.hero small{color:#fff;opacity:.92;font-weight:600;letter-spacing:.3px}
.hero h1{font-size:30px;margin:3px 0 2px;color:#fff;text-shadow:0 2px 10px rgba(120,20,60,.18)}
.hero p{margin:6px 0 0;font-size:13px;opacity:.95;max-width:30ch}
.heromoji{display:flex;flex-wrap:wrap;gap:6px;justify-content:flex-end;max-width:130px;position:relative}
.heromoji i{font-style:normal;font-size:24px;filter:drop-shadow(0 4px 6px rgba(90,20,60,.28));animation:float 5.5s ease-in-out infinite}
.heromoji i:nth-child(2){animation-delay:.5s}.heromoji i:nth-child(3){animation-delay:1s}
.heromoji i:nth-child(4){animation-delay:1.5s}.heromoji i:nth-child(5){animation-delay:2s}
@keyframes float{0%,100%{transform:translateY(0) rotate(-4deg)}50%{transform:translateY(-7px) rotate(5deg)}}
.hero .chips{position:relative;display:flex;gap:7px;margin-top:14px;flex-wrap:wrap}
.hero .chip{background:rgba(255,255,255,.22);border:1px solid rgba(255,255,255,.32);color:#fff;border-radius:999px;padding:6px 11px;font-size:12px;font-weight:700;display:flex;gap:6px;align-items:center;backdrop-filter:blur(4px)}
/* ---------- kartlar ---------- */
.card{background:var(--card);border:1px solid var(--bd);border-radius:20px;padding:15px;margin-bottom:12px;box-shadow:var(--sh2)}
.card.soft{background:var(--card2)}
.head{display:flex;justify-content:space-between;align-items:center;gap:10px}
.head h2{margin:0}
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:6px}
.tile{background:var(--card);border:1px solid var(--bd);border-radius:20px;padding:13px 14px;box-shadow:var(--sh2);position:relative;overflow:hidden}
.tile i{font-style:normal;font-size:19px;display:grid;place-items:center;width:32px;height:32px;border-radius:11px;background:var(--pk);margin-bottom:8px}
.tile small{display:block;font-size:11.5px;font-weight:700;letter-spacing:.2px;opacity:.85}
.tile b{font-family:"Iowan Old Style",Georgia,serif;font-size:21px;display:block;line-height:1.2;margin-top:1px;font-variant-numeric:tabular-nums}
.tile.hi{background:var(--grad);border:0;color:#fff;box-shadow:0 14px 30px -12px rgba(232,62,140,.65)}
.tile.hi small{opacity:.94;color:#fff}.tile.hi i{background:rgba(255,255,255,.25)}
.tile:after{content:"";position:absolute;right:-26px;top:-26px;width:74px;height:74px;border-radius:50%;background:var(--pk);opacity:.55}
.tile.hi:after{background:rgba(255,255,255,.18)}
.tile>*{position:relative}
/* hızlı işlemler */
.quick{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin:12px 0 4px}
.qbtn{display:flex;align-items:center;gap:10px;background:var(--card);border:1px solid var(--bd);border-radius:18px;padding:11px 12px;font:inherit;font-weight:700;font-size:13.5px;color:var(--tx);cursor:pointer;box-shadow:var(--sh2);transition:.16s;text-align:left}
.qbtn em{font-style:normal;font-size:20px;width:36px;height:36px;border-radius:12px;display:grid;place-items:center;background:var(--pk);flex:none}
.qbtn:active{transform:scale(.975)}
/* ---------- ürün fotoğrafı ---------- */
.ph{position:relative;container-type:size;background:var(--ph);border-radius:16px;overflow:hidden;display:grid;place-items:center;aspect-ratio:1/1;border:1px solid rgba(0,0,0,.045)}
.ph img{width:100%;height:100%;object-fit:contain;padding:5px;display:block}
.ph.emo{background:linear-gradient(150deg,hsla(var(--h),90%,94%,1),hsla(var(--h),95%,85%,1));border:1px solid hsla(var(--h),70%,88%,1)}
[data-theme=dark] .ph.emo{background:linear-gradient(150deg,hsla(var(--h),45%,26%,1),hsla(var(--h),40%,19%,1));border-color:hsla(var(--h),35%,33%,1)}
.ph.emo span{font-size:38px;font-size:54cqw;line-height:1;filter:drop-shadow(0 4px 6px rgba(0,0,0,.14))}
.ph.emo span.bg{position:absolute;right:-4%;bottom:-8%;font-size:40cqw;opacity:.13;filter:none}
/* ---------- katalog ızgarası ---------- */
.cat{display:grid;grid-template-columns:repeat(2,1fr);gap:11px}
.pcard{background:var(--card);border:1px solid var(--bd);border-radius:20px;padding:9px 9px 11px;box-shadow:var(--sh2);cursor:pointer;transition:.18s;position:relative;overflow:hidden;animation:up .38s both}
.pcard:active{transform:scale(.975)}
.pcard .ph{margin-bottom:8px}
.pcard .meta{margin-top:auto}
.pcard .nm{font-weight:700;font-size:13.5px;line-height:1.25;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;min-height:2.5em}
.pcard .meta{display:flex;justify-content:space-between;align-items:flex-end;gap:6px;margin-top:5px}
.pcard .meta small{font-size:11px;display:block}
.pcard .meta b{color:var(--pr);font-size:15px;font-variant-numeric:tabular-nums}
.badge{position:absolute;top:14px;left:14px;background:var(--gold);color:#3a2800;border-radius:999px;padding:2.5px 8px;font-size:10px;font-weight:800;letter-spacing:.2px;box-shadow:0 3px 8px rgba(0,0,0,.16)}
.badge.mint{background:var(--mint);color:#fff}
.badge.low{background:#e5484d;color:#fff}
@keyframes up{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
/* ---------- arama / filtre ---------- */
.search{position:relative;margin:0 0 12px;display:flex}
.search input{flex:1;min-width:0}
.search input{display:block;padding-left:40px;border-radius:16px;background:var(--card);box-shadow:var(--sh2);border-color:var(--bd)}
.search:before{content:"🔎";position:absolute;left:13px;top:50%;transform:translateY(-50%);font-size:15px;opacity:.7}
.chips{display:flex;gap:7px;overflow-x:auto;padding:2px 2px 10px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chips button{flex:none;border:1px solid var(--bd);background:var(--card);color:var(--mu);border-radius:999px;padding:7px 13px;font:inherit;font-size:12.5px;font-weight:700;cursor:pointer;transition:.16s;white-space:nowrap}
.chips button.on{background:var(--grad);color:#fff;border-color:transparent;box-shadow:0 8px 18px -8px rgba(232,62,140,.75)}
/* ---------- form ---------- */
label{display:block;font-size:12px;font-weight:700;color:var(--mu);margin:11px 0 0;letter-spacing:.2px}
label small{display:block;font-weight:500;letter-spacing:0;text-transform:none;margin-top:2px}
input,select,textarea{width:100%;padding:12px 13px;margin-top:5px;border:1px solid var(--bd);border-radius:14px;background:var(--card2);color:var(--tx);font:inherit;font-size:16px;transition:.15s;appearance:none}
select{background-image:linear-gradient(45deg,transparent 49%,var(--mu) 50%),linear-gradient(-45deg,transparent 49%,var(--mu) 50%);background-size:6px 6px,6px 6px;background-position:calc(100% - 17px) 21px,calc(100% - 11px) 21px;background-repeat:no-repeat;padding-right:32px}
input:focus,select:focus,textarea:focus{outline:0;border-color:var(--pr);box-shadow:0 0 0 4px color-mix(in srgb,var(--pr) 15%,transparent);background:var(--card)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;background:var(--grad);color:#fff;border:0;border-radius:14px;padding:12px 18px;font:inherit;font-weight:800;font-size:14px;cursor:pointer;box-shadow:0 10px 22px -12px rgba(232,62,140,.9);transition:.16s}
.btn:active{transform:scale(.97)}
.btn.sec{background:var(--pk);color:var(--pr);box-shadow:none}
.btn.ghost{background:transparent;border:1px solid var(--bd);color:var(--tx);box-shadow:none}
.btn.sm{padding:8px 12px;font-size:12.5px;border-radius:11px}
.btn.red{background:none;color:#e5484d;border:1px solid color-mix(in srgb,#e5484d 35%,transparent);box-shadow:none}
.btn.wide{width:100%}
.acts{display:flex;gap:9px;margin-top:14px;flex-wrap:wrap}
.acts .btn{flex:1;min-width:110px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.two3{display:grid;grid-template-columns:1.7fr .8fr .9fr 34px;gap:6px;margin:7px 0;align-items:start}
.two3 input,.two3 select{margin:0;padding:10px 8px;border-radius:11px;font-size:14px}
.x{border:1px dashed var(--bd);background:none;color:#e5484d;width:34px;height:38px;border-radius:11px;font-size:15px;cursor:pointer}
/* ---------- dozaj ---------- */
.step{display:grid;grid-template-columns:46px 1fr 46px;background:var(--card2);border:1px solid var(--bd);border-radius:14px;overflow:hidden;margin-top:5px}
.step button{border:0;background:none;color:var(--pr);font-size:20px;font-weight:800;cursor:pointer}
.step input{border:0;background:none;text-align:center;margin:0;font-weight:800;font-size:18px;border-radius:0;box-shadow:none!important}
/* ---------- tarif ---------- */
.rec{background:var(--card);border:1px solid var(--bd);border-radius:22px;overflow:hidden;box-shadow:var(--sh2);margin-bottom:13px;animation:up .4s both}
.rec .banner{position:relative;height:150px;background:linear-gradient(150deg,#ffe1ee,#ffe9d5)}
[data-theme=dark] .rec .banner{background:linear-gradient(150deg,#3a2340,#452433)}
.rec .banner img{width:100%;height:100%;object-fit:cover}
.rec .banner.ok{background:var(--ph)}
.rec .banner.ok img{object-fit:contain;padding:10px}
.banner .art{position:absolute;inset:0;display:grid;place-items:center;font-size:70px;filter:drop-shadow(0 6px 10px rgba(0,0,0,.15))}
.rec .banner .tag{position:absolute;left:12px;top:12px;background:rgba(255,255,255,.92);color:#2b1533;border-radius:999px;padding:4px 11px;font-size:11.5px;font-weight:800;box-shadow:0 4px 10px rgba(0,0,0,.12)}
.rec .body{padding:13px 14px 14px}
.rec .body b.nm{font-family:"Iowan Old Style",Georgia,serif;font-size:18px}
.priceRow{display:flex;justify-content:space-between;align-items:flex-end;gap:8px;margin-top:8px}
.priceRow .big{font-family:"Iowan Old Style",Georgia,serif;font-size:24px;color:var(--pr);line-height:1}
.priceRow small{font-size:11.5px;display:block}
.priceRow .sell{text-align:right}
.priceRow .sell b{font-family:"Iowan Old Style",Georgia,serif;font-size:19px;color:var(--mint)}
/* ---------- listeler ---------- */
.hrow{display:flex;align-items:center;gap:9px;padding:9px 0;border-bottom:1px solid var(--bd)}
.hrow:last-child{border-bottom:0}
.hrow>span{flex:1;min-width:0}
.hrow b{display:block;font-size:13.5px}
.need{margin:10px 0 0;padding:0;list-style:none}
.need li{display:flex;align-items:center;gap:9px;padding:7px 0;border-bottom:1px dashed var(--bd);font-size:13.5px}
.need li .ph{width:34px;height:34px;border-radius:11px;flex:none}
.need li .ph.emo span{font-size:19px}
.need li b{margin-left:auto;font-variant-numeric:tabular-nums;white-space:nowrap}
.pcard.sel{outline:2.5px solid var(--pr);outline-offset:-1px;background:var(--pk)}
.pcard.have{opacity:.55;cursor:default}
.pcard.have .nm{text-decoration:line-through;text-decoration-color:var(--mu);text-decoration-thickness:1px}
.pcard.sel .badge{background:var(--mint);color:#fff;left:auto;right:14px}
.brow{display:grid;gap:6px;grid-template-columns:1fr 1fr 1fr 32px;margin:8px 0;padding:9px;border:1px solid var(--bd);border-radius:15px;background:var(--card2)}
.brow .bn{grid-column:1/-1}
.brow input,.brow select{margin:0;padding:9px 8px;font-size:14px;border-radius:11px}
.brow .x{height:100%;min-height:38px}
.pickfoot{position:sticky;bottom:0;background:var(--card);border-top:1px solid var(--bd);padding:10px 18px calc(12px + env(safe-area-inset-bottom));margin:14px -18px -22px;display:flex;gap:9px}
.pickfoot .btn{flex:1}
.pickfoot small{align-self:center;font-weight:700;color:var(--mu)}
.need li span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.warn{background:color-mix(in srgb,#e5484d 12%,transparent);color:#c1121f;border-radius:14px;padding:11px 13px;margin:11px 0;font-size:13px;font-weight:600;border:1px solid color-mix(in srgb,#e5484d 22%,transparent)}
[data-theme=dark] .warn{color:#ff8f95}
.warn b{display:block;margin-bottom:3px}
.empty{text-align:center;padding:34px 18px;color:var(--mu);background:var(--card);border:1px dashed var(--bd);border-radius:22px}
.empty .e{font-size:44px;display:block;margin-bottom:8px}
.empty b{display:block;color:var(--tx);font-size:17px;margin-bottom:5px;font-family:"Iowan Old Style",Georgia,serif}
.mu{color:var(--mu)}
/* ---------- dialog ---------- */
dialog{border:0;padding:0;background:var(--card);color:var(--tx);width:min(100%,560px);max-height:92vh;border-radius:26px 26px 0 0;margin:auto auto 0;box-shadow:0 -20px 60px rgba(0,0,0,.28);overflow:hidden}
dialog::backdrop{background:rgba(43,21,51,.45);backdrop-filter:blur(3px)}
dialog[open]{animation:sheet .28s cubic-bezier(.2,.9,.25,1)}
@keyframes sheet{from{transform:translateY(24px);opacity:.4}to{transform:none;opacity:1}}
.dlg-head{position:sticky;top:0;z-index:2;display:flex;align-items:center;justify-content:space-between;gap:10px;padding:16px 18px 12px;background:var(--card);border-bottom:1px solid var(--bd)}
.dlg-head h3{margin:0;font-size:18px}
.dlg-head .x2{border:0;background:var(--pk);color:var(--pr);width:32px;height:32px;border-radius:50%;font-size:16px;cursor:pointer;flex:none}
.dlg-body{padding:4px 18px 22px;max-height:calc(92vh - 64px);overflow:auto;-webkit-overflow-scrolling:touch}
@media(min-width:700px){dialog{border-radius:26px;margin:auto;max-height:88vh}.dlg-body{max-height:calc(88vh - 64px)}}
/* ---------- toast ---------- */
#toast{position:fixed;left:50%;bottom:92px;transform:translate(-50%,24px);background:#2b1533;color:#fff;padding:11px 16px;border-radius:15px;font-size:13.5px;font-weight:600;opacity:0;pointer-events:none;transition:.28s;z-index:80;max-width:92vw;display:flex;align-items:center;gap:9px;box-shadow:0 14px 34px rgba(0,0,0,.3)}
#toast.show{opacity:1;transform:translate(-50%,0);pointer-events:auto}
#toast button{border:0;border-radius:9px;padding:5px 10px;font:inherit;font-size:12px;font-weight:800;background:#fff;color:#2b1533;cursor:pointer}
/* ---------- confetti ---------- */
.burst{position:fixed;pointer-events:none;z-index:90;font-size:20px;animation:fly .9s ease-out forwards}
@keyframes fly{to{transform:translate(var(--dx),var(--dy)) rotate(var(--r));opacity:0}}
/* ---------- grafik ---------- */
.chartwrap{background:var(--card);border:1px solid var(--bd);border-radius:20px;padding:8px 6px 4px;box-shadow:var(--sh2)}
.chartwrap small{display:block;padding:4px 10px 8px}
/* ---------- masaüstü ---------- */
@media(min-width:860px){
  #nav{position:sticky;top:0;left:0;right:auto;bottom:auto;height:100vh;width:224px;flex-direction:column;gap:5px;padding:22px 12px;border-top:0;border-right:1px solid var(--bd);background:color-mix(in srgb,var(--card) 70%,transparent);float:left}
  #nav button{flex:none;display:flex;align-items:center;gap:11px;justify-content:flex-start;font-size:14.5px;padding:11px 13px;border-radius:14px;text-align:left}
  #nav button span{font-size:18px}
  #app{padding-bottom:32px}
  #top{position:sticky;top:0}
  .tiles{grid-template-columns:repeat(4,1fr)}
  .cat{grid-template-columns:repeat(3,1fr)}
  .quick{grid-template-columns:repeat(4,1fr)}
}
@media(min-width:1120px){.cat{grid-template-columns:repeat(4,1fr)}#nav{width:240px}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div id="top"><div class="wrap">
  <div class="brand"><div class="logo" id="brandLogo">🧁</div><div style="min-width:0"><b id="brandName">Butik Mutfak</b><small id="brandSub">maliyet & satış</small></div></div>

/* ---------- hesaplar ---------- */
const ing=id=>D.ings.find(i=>i.id==id);
const findIng=n=>D.ings.find(i=>low(i.name)==low(String(n).trim()));
const stock=id=>D.buys.filter(b=>b.ing==id).reduce((a,b)=>a+b.qty,0)+D.moves.filter(m=>m.ing==id).reduce((a,m)=>a+m.qty,0);
const unitCost=id=>{const b=D.buys.filter(x=>x.ing==id),q=b.reduce((a,x)=>a+x.qty,0);return q?b.reduce((a,x)=>a+x.total,0)/q:0};
const energy=r=>{const s=D.settings,h=num(r.min)/60;let e=0;if(r.fuel=='gaz')e=h*s.ovenGas*s.gas;else if(r.fuel=='elk')e=h*s.ovenKw*s.elec;return e+num(r.water)/1000*s.water};
const costParts=(r,n)=>{const k=n/r.yield;let mat=0,ext=0;(r.items||[]).forEach(i=>mat+=i.qty*k*unitCost(i.ing));(r.extras||[]).forEach(e=>ext+=e.m=='unit'?e.a*n:e.a*k);return{mat,ext,en:energy(r)*k}};
const recipeCost=(r,n)=>{const p=costParts(r,n);return p.mat+p.ext+p.en};
const price=(c,m)=>{const p=c*(1+m/100),r=num(D.settings.round);return r?Math.ceil(p/r-1e-9)*r:p};
const fq=(q,b)=>{const a=Math.abs(q);return b=='adet'?+q.toFixed(1)+' adet':a>=1000?+(q/1000).toFixed(2)+(b=='g'?' kg':' L'):+q.toFixed(1)+(b=='g'?' g':' ml')};
const up=(i,c)=>{c=c??unitCost(i.id);return i.base=='adet'?TL(c)+' / adet':TL(c*1000)+(i.base=='g'?' / kg':' / L')};
const val=i=>stock(i.id)*unitCost(i.id);
const totVal=()=>D.ings.reduce((a,i)=>a+Math.max(0,val(i)),0);

                 :'radial-gradient(700px 320px at 0% 0%,#ffe3f0 0%,transparent 60%),radial-gradient(620px 300px at 100% 0%,#ffe8d6 0%,transparent 60%)';

/* ---------- yardımcı ---------- */
function toast(m,action){
  const t=$('#toast');
  t.innerHTML=`<span>${esc(m)}</span>`+(action?`<button onclick="${action[1]}">${esc(action[0])}</button>`:'');
  t.className='show';clearTimeout(toast.t);toast.t=setTimeout(()=>t.className='',action?9000:2600);
}
function burst(x,y){
  const ems=['🎉','🧁','✨','🍓','💖','⭐'];
  for(let i=0;i<14;i++){
    const s=document.createElement('span');s.className='burst';s.textContent=ems[i%ems.length];
    s.style.left=(x||innerWidth/2)+'px';s.style.top=(y||innerHeight/2)+'px';
    s.style.setProperty('--dx',(Math.random()*220-110)+'px');
    s.style.setProperty('--dy',(-Math.random()*200-60)+'px');
    s.style.setProperty('--r',(Math.random()*540-270)+'deg');
    document.body.appendChild(s);setTimeout(()=>s.remove(),950);
  }
}

const CATS=[['all','Tümü','✨'],['low','Azalan','🛒'],['un','Hamur & Un','🌾'],['sut','Süt & Yumurta','🥛'],['tatli','Tatlılık','🍫'],['meyve','Meyve','🍓'],['baharat','Baharat','🧂']];
function catOf(n){
  const k=low(n);
  if(/un\b|irmik|nişasta|bulgur|pirinç|makarna|galeta|yulaf/.test(k))return 'un';
  if(/süt|yumurta|tereyağ|margarin|krema|yoğurt|peynir|kaymak/.test(k))return 'sut';
  if(/şeker|çikolata|kakao|bal|pekmez|vanilya|süs/.test(k))return 'tatli';
  if(/limon|portakal|elma|muz|çilek|böğürtlen|meyve|hindistan|fındık|ceviz|badem|fıstık/.test(k))return 'meyve';
  if(/tuz|tarçın|kabartma|maya|baharat|karabiber/.test(k))return 'baharat';
  return 'all';
}
function listDolap(){
  let L=D.ings.filter(i=>low(i.name).includes(low(q)));
  if(flt=='low')L=L.filter(i=>i.min>0&&stock(i.id)<=i.min);
  else if(flt!='all')L=L.filter(i=>catOf(i.name)==flt);
  L.sort((a,b)=>sort=='ad'?a.name.localeCompare(b.name,'tr'):sort=='deger'?val(b)-val(a):(stock(a.id)-a.min)-(stock(b.id)-b.min));
  return L.length?L.map(pcard).join(''):`<div class="empty" style="grid-column:1/-1"><span class="e">🔍</span><b>Bulunamadı</b>Aramanı değiştir ya da yeni malzeme ekle.</div>`;
}

function compressImg(file,max,cb){
  const im=new Image(),u=URL.createObjectURL(file);
  im.onload=()=>{const s=Math.min(1,max/Math.max(im.width,im.height));
    const c=document.createElement('canvas');c.width=Math.round(im.width*s);c.height=Math.round(im.height*s);
    const ctx=c.getContext('2d');ctx.fillStyle='#fff';ctx.fillRect(0,0,c.width,c.height);ctx.drawImage(im,0,0,c.width,c.height);
    URL.revokeObjectURL(u);
    let q=.66,d=c.toDataURL('image/webp',q);
    if(!d.startsWith('data:image/webp'))d=c.toDataURL('image/jpeg',q);
    let tries=0;
    while(d.length>58000&&tries<4){q-=.14;d=c.toDataURL(d.startsWith('data:image/webp')?'image/webp':'image/jpeg',Math.max(.35,q));tries++}
    cb(d);
  };
  im.onerror=()=>{URL.revokeObjectURL(u);toast('Fotoğraf okunamadı')};
  im.src=u;
}

      <label>Kâr oranı %<input inputmode="decimal" value="${so.m??D.settings.markup}" oninput="so.m=this.value;calc()"></label>
    </div>
    <div id="res"></div>
    <div id="ord-extra">
      <div class="two"><label>Müşteri / not<input id="oc" placeholder="ör. Ayşe Hanım"></label>
      <label>Gerçek satış (ops.)<input id="oa" inputmode="decimal" placeholder="₺"></label></div>
      <button class="btn wide" style="margin-top:14px" onclick="saveOrd()">Siparişi kaydet 🧾</button>
    </div>
  </div>
  <h2>Açık siparişler <small style="font-size:13px;font-weight:600">${act.length}</small></h2>
  ${ordList(act)||`<div class="empty"><span class="e">🧾</span><b>Temizsin ✨</b>Bekleyen sipariş yok, harikasın!</div>`}
  ${cl.length?`<h2>Biten siparişler</h2>${ordList(cl)}`:''}`;
};
function stepN(d){const v=Math.max(0,num(so.n)+d);so.n=v||'';$('#qn').value=so.n;calc()}
function calc(){
  const r=D.recipes.find(x=>x.id==so.r),n=num(so.n),el=$('#res'),ex=$('#ord-extra');if(!el)return;
  if(ex)ex.style.display=r&&n>0?'':'none';
  if(!r||n<=0){el.innerHTML=D.recipes.length?'<p class="mu" style="margin:14px 0 0">Ürün ve adet seçince maliyet burada görünür.</p>':'';return}
  const k=n/r.yield,m=num(so.m??D.settings.markup),p=costParts(r,n),c=p.mat+p.ext+p.en,sp=price(c,m),miss=[];
  const need=(r.items||[]).map(it=>{const i=ing(it.ing);if(!i)return '';const nq=it.qty*k,s=stock(i.id);if(s<nq-1e-9)miss.push(`${esc(i.name)}: ${fq(nq-s,i.base)} eksik`);
    return `<li>${thumb(i.name)}<span style="flex:1;min-width:0">${esc(i.name)}</span><b>${fq(nq,i.base)}</b></li>`}).join('');
  el.innerHTML=`<h4>Gereken malzemeler</h4><ul class="need">${need}</ul>${miss.length?`<div class="warn"><b>⚠️ Stok yetersiz</b>${miss.join('<br>')}</div>`:''}
    <div class="tiles" style="margin-top:12px">
      <div class="tile"><i>💵</i><small>Güncel maliyet</small><b>${TL(c)}</b><small style="display:block;margin-top:2px">${TL(c/n)} / adet</small></div>
      <div class="tile hi"><i>✨</i><small>Satış fiyatı</small><b>${TL(sp)}</b><small style="display:block;margin-top:2px">${TL(sp/n)} / adet</small></div>
    </div>
    <small style="display:block;margin-top:10px">Malzeme ${TL(p.mat)} · enerji & su ${TL(p.en)} · ek gider ${TL(p.ext)}</small>
    <p style="font-weight:800;margin:8px 0 0">Tahmini kâr: <b style="color:var(--mint)">${TL(sp-c)}</b></p>`;
}
function saveOrd(){
  const r=D.recipes.find(x=>x.id==so.r),n=num(so.n);if(!r||n<=0){toast('Ürün ve adet seçin');return}
  const c=recipeCost(r,n),m=num(so.m??D.settings.markup);
  const oaEl=$('#oa'),ocEl=$('#oc');
  D.orders.push({id:uid(),name:r.name,qty:n,cost:c,price:price(c,m),actual:oaEl?num(oaEl.value):0,markup:m,cust:ocEl?ocEl.value.trim():'',status:'Bekliyor',date:today(),use:(r.items||[]).map(it=>({ing:it.ing,qty:it.qty*n/r.yield}))});
  save();so={r:'',n:'',m:null};render();toast('Sipariş kaydedildi 🧾');
}
function orderQuick(id){so={r:id,n:1,m:null};page='siparis';render()}
function recQuick(id){so={r:id,n:1,m:null};page='siparis';render()}
function setSt(id,s){
  const o=D.orders.find(x=>x.id==id),has=D.moves.some(m=>m.ord==id);
  if(s!='Bekliyor'&&!has){
    const short=(o.use||[]).some(u=>stock(u.ing)<u.qty-1e-9);
    if(!confirm((short?'Stok yetersiz, dolap eksiye düşebilir. ':'')+'Malzemeler Dolabım\'dan düşülecek. Onaylıyor musun?')){render();return}
    (o.use||[]).forEach(u=>D.moves.push({id:uid(),ing:u.ing,qty:-u.qty,date:today(),ord:id}));
  }else if(s=='Bekliyor'&&has)D.moves=D.moves.filter(m=>m.ord!=id);
  o.status=s;save();render();
  if(s=='Teslim edildi'){burst();toast('Sipariş kapandı, afiyet olsun 🎉')}
}
function delOrd(id){if(!confirm('Sipariş silinsin mi? Düşülen malzemeler dolaba geri eklenir.'))return;D.orders=D.orders.filter(o=>o.id!=id);D.moves=D.moves.filter(m=>m.ord!=id);save();render()}

/* ---------- RAPOR ---------- */
PG.rapor=()=>{
  const L=D.orders.filter(o=>(!fl.from||o.date>=fl.from)&&(!fl.to||o.date<=fl.to)),rev=o=>o.actual||o.price;
  const R=L.reduce((a,o)=>a+rev(o),0),C=L.reduce((a,o)=>a+o.cost,0),t={};
  L.forEach(o=>t[o.name]=(t[o.name]||0)+o.qty);
  const top=Object.entries(t).sort((a,b)=>b[1]-a[1]).slice(0,3);
  const g={};L.forEach(o=>{const k=o.date.slice(0,7);g[k]=g[k]||[0,0];g[k][0]+=rev(o);g[k][1]+=o.cost});
  const ks=Object.keys(g).sort().slice(-6),mx=Math.max(1,...ks.map(k=>g[k][0]));
  const step=Math.min(52,(268/Math.max(1,ks.length))), bw=Math.min(18,step*0.36);
  const bars=ks.map((k,i)=>{const x=16+i*step+(step-bw*2)/2,h1=g[k][0]/mx*84,h2=g[k][1]/mx*84;
    return `<rect x="${x}" y="${96-h1}" width="${bw}" height="${h1}" rx="5" fill="var(--pr)"/><rect x="${x+bw+3}" y="${96-h2}" width="${bw}" height="${h2}" rx="5" fill="var(--gold)"/><text x="${x+bw}" y="110" font-size="8" text-anchor="middle" fill="var(--mu)">${k.slice(5)}/${k.slice(2,4)}</text>`}).join('');
  return `<h2>Rapor</h2>
  <div class="two"><label>Başlangıç<input type="date" value="${fl.from}" onchange="fl.from=this.value;render()"></label>
  <label>Bitiş<input type="date" value="${fl.to}" onchange="fl.to=this.value;render()"></label></div>
  <div class="tiles" style="margin-top:12px">
    <div class="tile"><i>🧾</i><small>Toplam ciro</small><b>${TL(R)}</b></div>
    <div class="tile"><i>💵</i><small>Maliyet</small><b>${TL(C)}</b></div>
    <div class="tile hi"><i>💖</i><small>Toplam kâr</small><b>${TL(R-C)}</b></div>
    <div class="tile"><i>🏆</i><small>En çok satılan</small><b style="font-size:16px">${top[0]?esc(top[0][0]):'—'}</b></div>
  </div>
  ${ks.length?`<div class="chartwrap" style="margin-top:12px"><svg viewBox="0 0 300 116" width="100%" role="img" aria-label="Aylık ciro ve maliyet">${bars}</svg><small>💗 Ciro · 🌟 Maliyet</small></div>`:''}
  ${top.length?`<h2>Çok satanlar</h2><div class="cat">${top.map(([n,c])=>`<div class="pcard"><span class="badge" style="position:static;display:inline-block;margin-bottom:6px">${c} adet</span>${thumb(n)}<div class="nm">${esc(n)}</div></div>`).join('')}</div>`:''}
  <h2>Siparişler</h2>${ordList(L)||`<div class="empty"><span class="e">📊</span><b>Kayıt yok</b>Seçili tarihlerde sipariş bulunamadı.</div>`}`;
};

function restore(file){
  if(!file)return;const r=new FileReader();
  r.onload=()=>{try{const d=JSON.parse(r.result);if(!d.schema||!d.ings||!d.orders)throw 0;if(!confirm('Mevcut veriler silinip yedekteki veriler yüklenecek. Onaylıyor musun?'))return;D=d;D.settings=Object.assign({gas:0,elec:0,water:0,ovenGas:0.3,ovenKw:2.5},D.settings);save();render();toast('Yedek yüklendi')}catch(e){toast('Geçersiz yedek dosyası')}};
  r.readAsText(file);
